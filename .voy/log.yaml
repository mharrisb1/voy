debounce_ms: 1000
routes:
  - name: log_event
    watch:
      - "*.cpp"
      - "*.hpp"
      - "*.h"
    events:
      - all
    action:
      command:
        - bash
        - -c
        - |
          cat << EOF | jq -C
          {
            "timestamp": "$VOY_EVENT_TIME",
            "route": "$VOY_ROUTE_NAME",
            "batch_size": "$VOY_BATCH_SIZE",
            "event_type": "$VOY_EVENT_TYPE",
            "path": "$VOY_EVENT_PATH",
            "pid": "$$"
          }
          EOF
